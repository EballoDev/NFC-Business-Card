<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Christopher Eballo — Portfolio</title>
<meta name="description" content="Christopher Eballo — Portfolio, social links and contact." />
<meta name="theme-color" content="#0a0a0c" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   1. TOKENS  (LUXURY BLACK + GLOSSY WHITE)
   ============================================================ */
:root{
  --bg:            #0a0a0c;
  --text:          #f5f6f8;
  --muted:         #9aa1ad;
  --muted-soft:    #6b727e;
  --gloss-strong:  rgba(255,255,255,.16);
  --accent:        #4ade80;

  --card-bg:       rgba(18,18,22,.55);
  --card-border:   rgba(255,255,255,.08);
  --card-border-h: rgba(255,255,255,.22);

  --radius-md:     22px;
  --ease:          cubic-bezier(.2,.8,.2,1);
  --ease-back:     cubic-bezier(.34,1.56,.64,1);
  --ease-soft:     cubic-bezier(.4,0,.2,1);
}

/* ============================================================
   2. RESET + FULL-SCREEN BASE
   ============================================================ */
*{ margin:0; padding:0; box-sizing:border-box; }

html, body{
  height:100%;
  width:100%;
  overflow:hidden;
}

body{
  font-family:'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: clamp(16px, 3.2vmin, 42px);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  position:relative;
  isolation:isolate;
  cursor:default;
}

/* ============================================================
   3. ANIMATED BACKGROUND
   ============================================================ */
.bg-layer{
  position:fixed;
  inset:-8%;
  z-index:-3;
  transition: transform .8s cubic-bezier(.2,.8,.2,1);
  will-change: transform;
}
.bg-kb{
  position:absolute;
  inset:0;
  background-image:url("https://static.vecteezy.com/system/resources/thumbnails/025/480/053/small/abstarct-black-luxury-satin-background-ai-generated-free-photo.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  filter: brightness(.55) contrast(1.08) saturate(1.05);
  animation: bgMotion 26s ease-in-out infinite alternate;
  will-change: transform, filter;
}
@keyframes bgMotion{
  0%   { transform: scale(1.08) translate3d(0, 0, 0); }
  50%  { transform: scale(1.16) translate3d(-1.8%, -1.2%, 0); }
  100% { transform: scale(1.10) translate3d(1.6%, 1.0%, 0); }
}

.bg-overlay{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(0,0,0,.18) 0%, rgba(0,0,0,.72) 70%, rgba(0,0,0,.92) 100%),
    linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 35%, rgba(0,0,0,.75) 100%);
  pointer-events:none;
}

.bg-sheen{
  position:fixed;
  inset:-50%;
  z-index:-1;
  background: linear-gradient(
    115deg,
    transparent 0%,
    transparent 42%,
    rgba(255,255,255,.045) 50%,
    transparent 58%,
    transparent 100%
  );
  animation: sheenMove 14s linear infinite;
  pointer-events:none;
  mix-blend-mode: screen;
}
@keyframes sheenMove{
  0%   { transform: translateX(-35%) translateY(-10%) rotate(0deg); }
  100% { transform: translateX(35%)  translateY(10%)  rotate(0deg); }
}

/* ============================================================
   4. CURSOR GLOW  (interactive light that follows the pointer)
   ============================================================ */
.cursor-glow{
  position:fixed;
  top:0; left:0;
  width: 520px;
  height: 520px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(180,200,255,.10) 0%, rgba(140,160,220,.05) 35%, transparent 70%);
  pointer-events:none;
  z-index:1;
  transform: translate(-50%, -50%) scale(.4);
  opacity:0;
  transition: opacity .5s ease, transform .35s var(--ease-soft);
  mix-blend-mode: screen;
  filter: blur(4px);
  will-change: transform, opacity;
}
.cursor-glow.is-active{
  opacity:1;
  transform: translate(-50%, -50%) scale(1);
}

/* Small dot cursor companion */
.cursor-dot{
  position:fixed;
  top:0; left:0;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#ffffff;
  box-shadow: 0 0 14px rgba(255,255,255,.85);
  pointer-events:none;
  z-index:100;
  transform: translate(-50%, -50%);
  opacity:0;
  transition: opacity .4s ease, width .25s ease, height .25s ease, background .25s ease;
  mix-blend-mode: difference;
}
.cursor-dot.is-active{ opacity:.9; }
.cursor-dot.is-hot{
  width:0; height:0;
  opacity:0;
}

@media (pointer: coarse){
  .cursor-glow, .cursor-dot{ display:none; }
}

/* ============================================================
   5. NEOMORPHIC UTILITIES
   ============================================================ */
.neu-inset{
  background: rgba(255,255,255,.04);
  box-shadow:
    inset 3px 3px 8px rgba(0,0,0,.7),
    inset -3px -3px 8px rgba(255,255,255,.05);
}

/* ============================================================
   6. WELCOME / PRELOADER
   ============================================================ */
.preloader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.preloader .panel{
  position:absolute;
  left:0;
  width:100%;
  height:50.5%;
  background: #07070a;
  transition: transform 1s cubic-bezier(.86,0,.07,1);
  z-index:1;
}
.preloader .panel-top{ top:0; }
.preloader .panel-bottom{ bottom:0; }

.preloader.done .panel-top   { transform: translateY(-101%); }
.preloader.done .panel-bottom{ transform: translateY(101%); }
.preloader.done{ pointer-events:none; }

.preloader-content{
  position:relative;
  z-index:2;
  text-align:center;
  padding: 0 24px;
  transition: opacity .5s ease, transform .5s ease;
}
.preloader.done .preloader-content{
  opacity:0;
  transform: scale(.94);
}

.loader-ring{
  width:clamp(72px, 11vmin, 96px);
  height:clamp(72px, 11vmin, 96px);
  border-radius:50%;
  display:grid;
  place-items:center;
  margin: 0 auto clamp(20px, 3.5vmin, 30px);
  position:relative;
  background: #0d0d11;
  box-shadow:
    9px 9px 22px rgba(0,0,0,.85),
    -6px -6px 18px rgba(255,255,255,.045);
}
.loader-ring::before{
  content:'';
  position:absolute;
  inset:-6px;
  border-radius:50%;
  background: conic-gradient(from 0deg, transparent 0deg, transparent 200deg, #ffffff 360deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
  animation: spin 1.05s linear infinite;
}
.loader-ring span{
  font-weight:800;
  font-size: clamp(1.15rem, 2.4vmin, 1.6rem);
  letter-spacing:.06em;
  background: linear-gradient(145deg, #ffffff, #8f97a3);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.welcome-label{
  font-size: clamp(.6rem, 1.3vmin, .72rem);
  letter-spacing:.55em;
  text-transform:uppercase;
  color: var(--muted);
  margin-bottom: clamp(8px, 1.4vmin, 14px);
  opacity:0;
  animation: fadeUp .9s var(--ease) .15s forwards;
}
.welcome-name{
  font-size: clamp(1.05rem, 4.6vmin, 2.4rem);
  font-weight:800;
  letter-spacing:.22em;
  line-height:1.2;
  white-space:nowrap;
}
.welcome-name span{
  display:inline-block;
  opacity:0;
  transform: translateY(30px) rotateX(-70deg);
  animation: letterIn .8s var(--ease) forwards;
}

.progress{
  width:min(240px, 58vw);
  height:7px;
  margin: clamp(20px, 3.4vmin, 30px) auto 0;
  border-radius:99px;
  background: #0d0d11;
  box-shadow:
    inset 3px 3px 7px rgba(0,0,0,.9),
    inset -3px -3px 7px rgba(255,255,255,.045);
  overflow:hidden;
  position:relative;
}
.progress i{
  display:block;
  height:100%;
  width:0;
  border-radius:99px;
  background: linear-gradient(90deg, #6b727e, #ffffff);
  animation: load 1.9s cubic-bezier(.6,.05,.3,1) forwards;
}

/* ============================================================
   7. HERO — FULL SCREEN FLEX LAYOUT
   ============================================================ */
.hero{
  width:100%;
  max-width: 880px;
  height:100%;
  max-height: 100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap: clamp(10px, 1.8vmin, 22px);
  position:relative;
  z-index:2;
}

/* --- Availability badge (magnetic) --- */
.badge{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding: clamp(7px, 1.1vmin, 10px) clamp(14px, 2vmin, 20px);
  border-radius:99px;
  font-size: clamp(.6rem, 1.25vmin, .74rem);
  font-weight:500;
  letter-spacing:.14em;
  text-transform:uppercase;
  color: #d6dae1;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border:1px solid rgba(255,255,255,.07);
  flex:0 0 auto;
  translate: var(--mag-x, 0px) var(--mag-y, 0px);
  transition: translate .35s cubic-bezier(.2,.8,.2,1), border-color .35s ease, box-shadow .35s ease;
  will-change: translate;
}
.badge:hover{
  border-color: rgba(74,222,128,.35);
  box-shadow:
    0 0 0 1px rgba(74,222,128,.15),
    0 8px 28px rgba(74,222,128,.12),
    inset 3px 3px 8px rgba(0,0,0,.7),
    inset -3px -3px 8px rgba(255,255,255,.05);
}
.badge .dot{
  width:7px; height:7px;
  border-radius:50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(74,222,128,.18);
  animation: pulse 2s ease-in-out infinite;
  position:relative;
}

/* --- Name & tagline --- */
.name{
  font-size: clamp(1.9rem, 8.6vmin, 4rem);
  font-weight:800;
  letter-spacing:-.028em;
  line-height:1.02;
  text-shadow: 0 6px 28px rgba(0,0,0,.6);
  flex:0 0 auto;
  transition: letter-spacing .5s var(--ease-soft), text-shadow .5s ease;
  will-change: transform;
}
.name:hover{
  letter-spacing:-.018em;
  text-shadow: 0 8px 34px rgba(0,0,0,.75), 0 0 40px rgba(180,200,255,.15);
}
.name em{
  font-style:normal;
  background: linear-gradient(135deg, #ffffff 15%, #9aa1ad 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  display:inline-block;
  transition: filter .5s ease;
}
.name:hover em{
  filter: drop-shadow(0 0 26px rgba(255,255,255,.25));
}

.tagline{
  font-size: clamp(.74rem, 1.9vmin, .98rem);
  font-weight:400;
  line-height:1.65;
  color: #b7bdc7;
  max-width:540px;
  text-shadow: 0 2px 12px rgba(0,0,0,.6);
  flex:0 0 auto;
}
.tagline strong{ color:#ffffff; font-weight:600; }

/* ============================================================
   8. LINK CARDS  (INTERACTIVE / TILT / SPOTLIGHT)
   ============================================================ */
.links{
  display:grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: clamp(11px, 1.7vmin, 20px);
  width:100%;
  margin-top: clamp(6px, 1.4vmin, 16px);
  flex:0 0 auto;
  perspective: 1200px;
}

.card{
  position:relative;
  display:flex;
  align-items:center;
  gap: clamp(11px, 1.6vmin, 16px);
  padding: clamp(13px, 1.9vmin, 20px) clamp(14px, 2vmin, 22px);
  border-radius: var(--radius-md);
  text-decoration:none;
  color: #f5f6f8;
  background: var(--card-bg);
  border:1px solid var(--card-border);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow:
    0 12px 30px rgba(0,0,0,.55),
    0 2px 6px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.08);
  overflow:hidden;
  isolation:isolate;
  cursor:pointer;
  transform-style: preserve-3d;
  transform:
    perspective(1000px)
    translateY(var(--ty, 0px))
    scale(var(--sc, 1))
    rotateX(var(--rx, 0deg))
    rotateY(var(--ry, 0deg));
  transition:
    transform .55s var(--ease-back),
    border-color .4s ease,
    box-shadow .5s var(--ease),
    background .4s ease;
  will-change: transform;
}
.card.is-tracking{
  transition:
    transform .12s ease-out,
    border-color .4s ease,
    box-shadow .5s var(--ease),
    background .4s ease;
}

/* Glossy top highlight */
.card::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  background: linear-gradient(150deg, var(--gloss-strong), transparent 48%);
  opacity:.75;
  pointer-events:none;
  z-index:1;
  transition: opacity .4s ease;
}

/* Brand-colored glow on hover */
.card::after{
  content:'';
  position:absolute;
  inset:-45%;
  border-radius:50%;
  background: radial-gradient(circle, var(--glow, transparent) 0%, transparent 62%);
  opacity:0;
  transition: opacity .5s ease;
  pointer-events:none;
  z-index:0;
}

/* Cursor spotlight following pointer inside the card */
.card .spotlight{
  position:absolute;
  inset:0;
  border-radius:inherit;
  background: radial-gradient(
    280px circle at var(--mx, 50%) var(--my, 50%),
    rgba(255,255,255,.14),
    rgba(255,255,255,.04) 30%,
    transparent 60%
  );
  opacity:0;
  transition: opacity .35s ease;
  pointer-events:none;
  z-index:2;
}

/* Shine sweep */
.card .shine{
  position:absolute;
  top:-20%;
  left:-120%;
  width:60%;
  height:140%;
  background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.22) 50%, transparent 100%);
  transform: skewX(-22deg);
  transition: left .85s cubic-bezier(.3,.7,.2,1);
  pointer-events:none;
  z-index:3;
}

/* Click ripple */
.card .ripple{
  position:absolute;
  border-radius:50%;
  background: radial-gradient(circle, rgba(255,255,255,.45), rgba(255,255,255,.05) 70%);
  transform: scale(0);
  animation: rippleOut .75s cubic-bezier(.2,.8,.2,1) forwards;
  pointer-events:none;
  z-index:6;
}

.card:hover,
.card.is-hover{
  --ty: -8px;
  --sc: 1.025;
  border-color: var(--card-border-h);
  background: rgba(26,26,32,.68);
  box-shadow:
    0 26px 52px rgba(0,0,0,.68),
    0 6px 16px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.16);
}
.card:hover::before,
.card.is-hover::before{ opacity:1; }
.card:hover::after,
.card.is-hover::after{ opacity:.55; }
.card:hover .shine,
.card.is-hover .shine{ left:140%; }
.card:hover .spotlight,
.card.is-hover .spotlight{ opacity:1; }

.card:active{
  --ty: -2px;
  --sc: .985;
  transition: transform .12s ease;
  box-shadow:
    0 6px 16px rgba(0,0,0,.6),
    inset 0 2px 8px rgba(0,0,0,.55);
}

/* --- Card icon --- */
.card-icon{
  flex:0 0 auto;
  width: clamp(40px, 5.4vmin, 54px);
  height: clamp(40px, 5.4vmin, 54px);
  border-radius: clamp(12px, 1.7vmin, 17px);
  display:grid;
  place-items:center;
  position:relative;
  z-index:4;
  background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    0 4px 12px rgba(0,0,0,.35);
  transition: transform .5s var(--ease-back), box-shadow .4s ease, border-color .4s ease;
  transform: translateZ(20px);
}
.card:hover .card-icon,
.card.is-hover .card-icon{
  transform: translateZ(30px) scale(1.1) rotate(-6deg);
  border-color: rgba(255,255,255,.22);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    0 10px 24px rgba(0,0,0,.55);
}
.card.is-clicking .card-icon{
  animation: iconPop .6s var(--ease-back);
}
.card-icon svg{
  width: clamp(17px, 2.3vmin, 23px);
  height: clamp(17px, 2.3vmin, 23px);
  stroke: currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  fill:none;
}

/* --- Card text --- */
.card-text{
  flex:1 1 auto;
  min-width:0;
  text-align:left;
  position:relative;
  z-index:4;
  transform: translateZ(14px);
}
.card-text h3{
  font-size: clamp(.78rem, 1.7vmin, .98rem);
  font-weight:700;
  letter-spacing:-.01em;
  margin-bottom:2px;
  transition: letter-spacing .45s var(--ease-soft);
}
.card:hover .card-text h3,
.card.is-hover .card-text h3{ letter-spacing:0; }
.card-text p{
  font-size: clamp(.62rem, 1.25vmin, .76rem);
  font-weight:400;
  color: var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition: color .35s ease;
}
.card:hover .card-text p,
.card.is-hover .card-text p{ color:#c9ced8; }

/* --- Arrow --- */
.card-arrow{
  flex:0 0 auto;
  width: clamp(16px, 2vmin, 20px);
  height: clamp(16px, 2vmin, 20px);
  color:#cfd4dc;
  opacity:0;
  transform: translateX(-8px) translateZ(24px);
  transition: opacity .35s ease, transform .45s var(--ease-back);
  position:relative;
  z-index:4;
}
.card-arrow svg{
  width:100%; height:100%;
  stroke:currentColor;
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.card:hover .card-arrow,
.card.is-hover .card-arrow{
  opacity:1;
  transform: translateX(0) translateZ(24px);
}

/* --- Brand colors --- */
.card.portfolio { --glow: rgba(99,132,255,.65); }
.card.facebook  { --glow: rgba(24,119,242,.65); }
.card.instagram { --glow: rgba(225,48,108,.65); }
.card.contact   { --glow: rgba(74,222,128,.65);  }

.card.portfolio .card-icon { color:#8ba4ff; }
.card.facebook  .card-icon { color:#5b9dff; }
.card.instagram .card-icon { color:#ff6fa1; }
.card.contact   .card-icon { color:#4ade80; }

/* ============================================================
   9. FOOTER
   ============================================================ */
.footer{
  font-size: clamp(.55rem, 1.05vmin, .7rem);
  letter-spacing:.14em;
  text-transform:uppercase;
  color: var(--muted-soft);
  flex:0 0 auto;
  padding-top: clamp(2px, 1vmin, 10px);
  transition: color .4s ease, letter-spacing .5s var(--ease-soft);
}
.footer:hover{
  color: var(--muted);
  letter-spacing:.18em;
}
.footer b{ color:#e9ebef; font-weight:600; }

/* ============================================================
   10. REVEAL ANIMATION
   ============================================================ */
.reveal{
  opacity:0;
  transform: translateY(34px) scale(.96);
  filter: blur(6px);
}
body.loaded .reveal{
  animation: revealUp 1s var(--ease-back) forwards;
  animation-delay: var(--d, 0s);
}

/* ============================================================
   11. KEYFRAMES
   ============================================================ */
@keyframes spin{ to{ transform: rotate(360deg); } }

@keyframes letterIn{
  to{ opacity:1; transform: translateY(0) rotateX(0deg); }
}

@keyframes fadeUp{
  from{ opacity:0; transform: translateY(14px); }
  to  { opacity:1; transform: translateY(0); }
}

@keyframes load{ to{ width:100%; } }

@keyframes revealUp{
  0%   { opacity:0; transform: translateY(34px) scale(.96); filter: blur(6px); }
  60%  { opacity:1; filter: blur(0); }
  100% { opacity:1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes pulse{
  0%,100%{ opacity:1;   transform: scale(1); }
  50%    { opacity:.45; transform: scale(.86); }
}

@keyframes rippleOut{
  0%   { transform: scale(0);   opacity:1; }
  100% { transform: scale(2.4); opacity:0; }
}

@keyframes iconPop{
  0%   { transform: translateZ(30px) scale(1.1) rotate(-6deg); }
  35%  { transform: translateZ(40px) scale(1.35) rotate(-14deg); }
  70%  { transform: translateZ(32px) scale(1.05) rotate(-4deg); }
  100% { transform: translateZ(30px) scale(1.1) rotate(-6deg); }
}

/* ============================================================
   12. RESPONSIVE
   ============================================================ */
@media (max-width: 820px){
  body{ padding: clamp(14px, 2.6vmin, 26px); }
}

@media (max-width: 640px){
  body{ padding: clamp(12px, 3vmin, 20px); }

  .hero{ gap: clamp(9px, 1.8vmin, 16px); }

  .links{
    grid-template-columns: 1fr 1fr;
    gap: clamp(9px, 2vmin, 14px);
    perspective: 800px;
  }

  .card{
    flex-direction: column;
    justify-content: center;
    text-align:center;
    gap: clamp(7px, 1.4vmin, 11px);
    padding: clamp(12px, 2.6vmin, 18px) clamp(8px, 1.8vmin, 14px);
    border-radius: 18px;
  }

  .card-text{ text-align:center; }

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
<script>
(function () {
  "use strict";

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var isFinePointer = window.matchMedia("(pointer: fine)").matches;
  var isTouch = window.matchMedia("(hover: none)").matches;

  /* ============================================================
     1. WELCOME LETTERS
     ============================================================ */
  var NAME = "CHRISTOPHER EBALLO";
  var welcomeName = document.getElementById("welcomeName");

  welcomeName.innerHTML = NAME.split("").map(function (ch, i) {
    var delay = (0.35 + i * 0.045).toFixed(3);
    var char  = ch === " " ? "&nbsp;" : ch;
    return '<span style="animation-delay:' + delay + 's">' + char + "</span>";
  }).join("");

  /* ============================================================
     2. PRELOADER → REVEAL
     ============================================================ */
  var preloader = document.getElementById("preloader");
  var REVEAL_AT = 2400;
  var REMOVE_AT = 1150;

  function startReveal() {
    if (!preloader || preloader.classList.contains("done")) return;
    preloader.classList.add("done");
    document.body.classList.add("loaded");

    setTimeout(function () {
      if (preloader && preloader.parentNode) preloader.parentNode.removeChild(preloader);
    }, REMOVE_AT + 150);
  }

  if (document.readyState === "complete") {
    setTimeout(startReveal, REVEAL_AT);
  } else {
    window.addEventListener("load", function () {
      setTimeout(startReveal, REVEAL_AT);
    });
  }

  setTimeout(function () {
    if (preloader && preloader.parentNode && !preloader.classList.contains("done")) {
      startReveal();
    }
  }, 7000);

  /* ============================================================
     3. CURSOR GLOW + DOT
     ============================================================ */
  if (isFinePointer && !reduceMotion) {
    var glow = document.getElementById("cursorGlow");
    var dot  = document.getElementById("cursorDot");

    var mx = window.innerWidth / 2,
        my = window.innerHeight / 2,
        gx = mx, gy = my,
        dx = mx, dy = my;

    function onMove(e) {
      mx = e.clientX;
      my = e.clientY;
      glow.classList.add("is-active");
      dot.classList.add("is-active");
    }
    function onLeave() {
      glow.classList.remove("is-active");
      dot.classList.remove("is-active");
    }

    window.addEventListener("mousemove", onMove, { passive: true });
    window.addEventListener("mouseout", function (e) {
      if (!e.relatedTarget) onLeave();
    });

    (function tick() {
      /* Smooth, lagging glow */
      gx += (mx - gx) * 0.12;
      gy += (my - gy) * 0.12;
      glow.style.transform = "translate(" + (gx - 260) + "px," + (gy - 260) + "px) scale(1)";

      /* Snappier dot */
      dx += (mx - dx) * 0.35;
      dy += (my - dy) * 0.35;
      dot.style.transform = "translate(" + (dx - 3) + "px," + (dy - 3) + "px)";

      requestAnimationFrame(tick);
    })();

    /* Highlight dot on interactive elements */
    document.querySelectorAll("a, button").forEach(function (el) {
      el.addEventListener("mouseenter", function () {
        dot.classList.add("is-hot");
        glow.style.opacity = "1";
      });
      el.addEventListener("mouseleave", function () {
        dot.classList.remove("is-hot");
      });
    });
  }

  /* ============================================================
     4. CARD INTERACTIONS  (tilt + spotlight + ripple + icon pop)
     ============================================================ */
  var cards = document.querySelectorAll(".card");

  cards.forEach(function (card) {
    var rafId = null;
    var pending = null;

    /* ---- Tilt + spotlight tracking ---- */
    function updateCard() {
      rafId = null;
      if (!pending) return;
      var e = pending;
      var rect = card.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;

      /* Spotlight position via custom props */
      card.style.setProperty("--mx", x + "px");
      card.style.setProperty("--my", y + "px");

      /* 3D tilt based on position within the card */
      var cx = rect.width / 2;
      var cy = rect.height / 2;
      var tiltX = ((y - cy) / cy) * -8;    /* max ±8deg */
      var tiltY = ((x - cx) / cx) * 8;
      var maxTilt = isTouch ? 0 : 1;
      card.style.setProperty("--rx", (tiltX * maxTilt).toFixed(2) + "deg");
      card.style.setProperty("--ry", (tiltY * maxTilt).toFixed(2) + "deg");
    }

    function onMove(e) {
      pending = e;
      if (rafId == null) rafId = requestAnimationFrame(updateCard);
    }

    function onEnter() {
      if (isTouch) return;
      card.classList.add("is-hover", "is-tracking");
    }

    function onLeave() {
      card.classList.remove("is-hover", "is-tracking");
      card.style.setProperty("--rx", "0deg");
      card.style.setProperty("--ry", "0deg");
      pending = null;
    }

    if (!isTouch && !reduceMotion) {
      card.addEventListener("mouseenter", onEnter);
      card.addEventListener("mousemove", onMove, { passive: true });
      card.addEventListener("mouseleave", onLeave);
    }

    /* ---- Click ripple + icon pop ---- */
    card.addEventListener("pointerdown", function (e) {
      var rect = card.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height) * 1.2;
      var x = e.clientX - rect.left - size / 2;
      var y = e.clientY - rect.top  - size / 2;

      var ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width  = size + "px";
      ripple.style.height = size + "px";
      ripple.style.left   = x + "px";
      ripple.style.top    = y + "px";
      card.appendChild(ripple);

      card.classList.add("is-clicking");
      setTimeout(function () { card.classList.remove("is-clicking"); }, 600);
      setTimeout(function () {
        if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
      }, 800);
    });

    /* ---- Keyboard activation for accessibility ---- */
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        var rect = card.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height) * 1.2;
        var ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.width  = size + "px";
        ripple.style.height = size + "px";
        ripple.style.left   = (rect.width  / 2 - size / 2) + "px";
        ripple.style.top    = (rect.height / 2 - size / 2) + "px";
        card.appendChild(ripple);
        setTimeout(function () {
          if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
        }, 800);
      }
    });
  });

  /* ============================================================
     5. MAGNETIC BADGE
     ============================================================ */
  var badge = document.getElementById("badge");
  if (badge && isFinePointer && !reduceMotion) {
    var bx = 0, by = 0;

    badge.addEventListener("mousemove", function (e) {
      var rect = badge.getBoundingClientRect();
      var relX = e.clientX - (rect.left + rect.width  / 2);
      var relY = e.clientY - (rect.top  + rect.height / 2);
      bx = relX * 0.22;
      by = relY * 0.30;
      badge.style.setProperty("--mag-x", bx.toFixed(2) + "px");
      badge.style.setProperty("--mag-y", by.toFixed(2) + "px");
    });

    badge.addEventListener("mouseleave", function () {
      badge.style.setProperty("--mag-x", "0px");
      badge.style.setProperty("--mag-y", "0px");
    });
  }

  /* ============================================================
     6. NAME MICRO-PARALLAX
     ============================================================ */
  var heroName = document.getElementById("heroName");
  if (heroName && isFinePointer && !reduceMotion) {
    var ntx = 0, nty = 0, ncx = 0, ncy = 0;

    window.addEventListener("mousemove", function (e) {
      ntx = (e.clientX / window.innerWidth  - 0.5) * 10;
      nty = (e.clientY / window.innerHeight - 0.5) * 6;
    });

    (function nameLoop() {
      ncx += (ntx - ncx) * 0.06;
      ncy += (nty - ncy) * 0.06;
      heroName.style.transform =
        "translate3d(" + ncx.toFixed(2) + "px," + ncy.toFixed(2) + "px,0)";
      requestAnimationFrame(nameLoop);
    })();
  }

  /* ============================================================
     7. BACKGROUND PARALLAX
     ============================================================ */
  var bgLayer = document.getElementById("bgLayer");
  if (bgLayer && isFinePointer && !reduceMotion) {
    var ptx = 0, pty = 0, pcx = 0, pcy = 0;

    window.addEventListener("mousemove", function (e) {
      ptx = (e.clientX / window.innerWidth  - 0.5) * -30;
      pty = (e.clientY / window.innerHeight - 0.5) * -30;
    });

    (function bgLoop() {
      pcx += (ptx - pcx) * 0.05;
      pcy += (pty - pcy) * 0.05;
      bgLayer.style.transform =
        "translate3d(" + pcx.toFixed(2) + "px," + pcy.toFixed(2) + "px,0)";
      requestAnimationFrame(bgLoop);
    })();
  }

  /* ============================================================
     8. TOUCH: STICKY-HOVER PREVENTION
     ============================================================ */
  if (isTouch) {
    cards.forEach(function (card) {
      card.addEventListener("touchstart", function () {
        cards.forEach(function (c) { c.classList.remove("is-hover"); });
        card.classList.add("is-hover");
      }, { passive: true });
      card.addEventListener("touchend", function () {
        setTimeout(function () { card.classList.remove("is-hover"); }, 260);
      }, { passive: true });
    });
  }

  /* ============================================================
     9. PREVENT PINCH / DOUBLE-TAP ZOOM
     ============================================================ */
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });

  var lastTouch = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

})();
</script>
